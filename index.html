<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sefa Köfte – Ödeme Bilgileri</title>
<style>
:root{--red:#d71920;--red-d:#a80f15;--yellow:#ffd21f;--bg:#fff6f0;--card:#ffffff;--text:#2a1a1a;--muted:#7a6666;--line:#f0d9d2;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1d1111;--card:#2a1818;--text:#fbeeea;--muted:#c4a8a2;--line:#4a2a2a}}
:root[data-theme="dark"]{--bg:#1d1111;--card:#2a1818;--text:#fbeeea;--muted:#c4a8a2;--line:#4a2a2a}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--text);font-family:-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;line-height:1.45}
.hero{background:var(--red);color:#fff;text-align:center;padding:28px 20px 56px;border-radius:0 0 32px 32px}
.logo{display:inline-flex;align-items:center;gap:2px;font-weight:900;font-size:34px;letter-spacing:1px;background:#fff;color:var(--red);padding:8px 18px;border-radius:14px;box-shadow:0 4px 0 var(--red-d)}
.smile{display:inline-block;width:.8em;height:.8em;border-radius:50%;background:var(--yellow);position:relative;margin:0 1px;border:2px solid var(--red);vertical-align:middle}
.smile::before{content:"";position:absolute;left:20%;top:26%;width:60%;height:12%;background:radial-gradient(circle at 15% 50%,var(--red) 55%,transparent 60%) left/30% 100% no-repeat,radial-gradient(circle at 85% 50%,var(--red) 55%,transparent 60%) right/30% 100% no-repeat}
.smile::after{content:"";position:absolute;left:22%;top:46%;width:56%;height:30%;border-bottom:2px solid var(--red);border-radius:0 0 50% 50%}
.sub{margin:10px 0 0;font-weight:700;letter-spacing:3px;font-size:14px;color:var(--yellow)}
.hero h1{margin:18px 0 4px;font-size:22px}
.hero p{margin:0;opacity:.92;font-size:15px}
main{max-width:480px;margin:-34px auto 0;padding:0 16px 32px}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:18px;margin-bottom:16px;box-shadow:0 6px 18px rgba(120,20,20,.10)}
.bank{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.bank b{font-size:18px}
.badge{background:var(--yellow);color:#4a2a00;font-size:12px;font-weight:800;padding:3px 9px;border-radius:99px}
.row{margin:12px 0}
.lbl{font-size:12px;text-transform:uppercase;letter-spacing:1px;color:var(--muted);font-weight:700}
.val{font-size:16px;font-weight:600;word-break:break-word}
.iban{font-size:18px;letter-spacing:.5px;font-family:ui-monospace,Menlo,Consolas,monospace;font-weight:700}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;border:0;border-radius:14px;padding:15px;font-size:16px;font-weight:800;cursor:pointer;text-decoration:none;font-family:inherit}
.copy{background:var(--red);color:#fff;margin-top:6px}
.copy:active{background:var(--red-d)}
.copy.ok{background:#1f9d4d}
.note{font-size:13px;color:var(--muted);text-align:center;margin:4px 8px 16px}
.call{background:var(--yellow);color:#4a2a00;margin-top:10px}
.contact h2{margin:0 0 8px;font-size:17px}
.addr{font-size:14px;color:var(--muted);margin:0 0 6px}
footer{text-align:center;font-size:12px;color:var(--muted);padding:0 16px 24px}
</style>
</head>
<body>
<header class="hero">
  <div class="logo">SEFA K<span class="smile"></span>FTE</div>
  <p class="sub">SULU YEMEK SALONU</p>
  <h1>Ödeme Bilgileri</h1>
  <p>Havale / EFT ile kolayca ödeme yapabilirsiniz</p>
</header>

<main>
  <div id="accounts"></div>

  <section class="card contact">
    <h2>İletişim</h2>
    <p class="addr">Tevfik Bey Mah. Yeldeğirmeni Cad. No: 23 C1 Sefaköy / İstanbul</p>
    <a class="btn call" href="tel:+905333373852">📞 0533 337 38 52</a>
    <a class="btn call" href="tel:+902124258274">☎️ 0212 425 82 74</a>
  </section>
</main>
<footer>Afiyet olsun! 😊</footer>

<script>
// IBAN bilgilerini buraya ekleyeceğiz. Birden fazla hesap için yeni bir satır eklemeniz yeterli.
var ACCOUNTS = [
  { banka: "TEB Bankası", hesapSahibi: "Mustafa Veyisoğlu", iban: "TR44 0003 2000 0000 0043 2142 78", sube: "" }
];

function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}

var html = "";
ACCOUNTS.forEach(function(a,i){
  html += '<section class="card">' +
    '<div class="bank"><b>' + esc(a.banka) + '</b><span class="badge">IBAN</span></div>' +
    '<div class="row"><div class="lbl">Hesap Sahibi</div><div class="val">' + esc(a.hesapSahibi) + '</div></div>' +
    (a.sube ? '<div class="row"><div class="lbl">Şube</div><div class="val">' + esc(a.sube) + '</div></div>' : '') +
    '<div class="row"><div class="lbl">IBAN</div><div class="val iban" id="iban' + i + '">' + esc(a.iban) + '</div></div>' +
    '<button class="btn copy" data-i="' + i + '">IBAN\'ı Kopyala</button>' +
    '</section>';
});
document.getElementById("accounts").innerHTML = html;

function fallbackCopy(text){
  var t = document.createElement("textarea");
  t.value = text; t.style.position = "fixed"; t.style.opacity = "0";
  document.body.appendChild(t); t.focus(); t.select();
  try { document.execCommand("copy"); } catch(e) {}
  document.body.removeChild(t);
}

document.querySelectorAll(".copy").forEach(function(btn){
  btn.addEventListener("click", function(){
    var text = ACCOUNTS[btn.dataset.i].iban.replace(/\s+/g,"");
    var done = function(){
      btn.classList.add("ok"); btn.textContent = "✓ Kopyalandı";
      setTimeout(function(){ btn.classList.remove("ok"); btn.textContent = "IBAN'ı Kopyala"; }, 2000);
    };
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(done, function(){ fallbackCopy(text); done(); });
    } else { fallbackCopy(text); done(); }
  });
});
</script>
</body>
</html>
